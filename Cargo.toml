[workspace]
members = [
  "crates/depscan-core",
  "crates/depscan-parsers",
  "crates/depscan-providers",
  "crates/depscan-report",
  "crates/depscan-cli",
]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gedankrayze/depscan"
homepage = "https://github.com/gedankrayze/depscan"
rust-version = "1.96.0"
authors = ["depscan contributors"]
readme = "README.md"
keywords = ["security", "dependencies", "vulnerability", "osv", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[workspace.dependencies]
depscan-core = { version = "1.2.0", path = "crates/depscan-core" }
depscan-parsers = { version = "1.2.0", path = "crates/depscan-parsers" }
depscan-providers = { version = "1.2.0", path = "crates/depscan-providers" }
depscan-report = { version = "1.2.0", path = "crates/depscan-report" }
async-trait = "0.1.92"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
cap-tempfile = "4.0.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
cvss = { version = "2.2.0", default-features = false, features = ["std", "v3", "v4"] }
directories = "6.0.0"
fs2 = "0.4.3"
futures = "0.3.34"
glob = "0.3.4"
httpdate = "1.0.3"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "json", "http2", "stream"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
noyalib = { version = "0.0.26", default-features = false, features = ["std"] }
js-semver = "0.3.0"
sha2 = "0.11.0"
toml = "1.1.4"
thiserror = "2.0.20"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
percent-encoding = "2.3.2"
unicode-general-category = "1.1.0"
walkdir = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
pep440_rs = "0.7.3"
pep508_rs = "0.9.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dist]
inherits = "release"

[workspace.metadata.dist]
dist = true
allow-dirty = ["ci"] # release.yml contains reviewed permission, gating, and lint hardening
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "msi"]
checksum = "sha256"
github-attestations = true
github-attestations-phase = "host"
github-release = "host"
plan-jobs = ["./release-quality"]
pr-run-mode = "plan"
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
"actions/setup-node" = "48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e" # v6.4.0

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
pre-release-commit-message = "release: {{version}}"
tag-message = "{{version}}"
