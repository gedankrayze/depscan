[workspace]
members = [
  "crates/depscan-core",
  "crates/depscan-parsers",
  "crates/depscan-providers",
  "crates/depscan-report",
  "crates/depscan-cli",
]
resolver = "3"

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gedankrayze/depscan"
rust-version = "1.95.0"
authors = ["depscan contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = "4.6.9"
cvss = { version = "2.2.0", default-features = false, features = ["std", "v3", "v4"] }
directories = "6.0.0"
fs2 = "0.4.3"
futures = "0.3.34"
glob = "0.3.4"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "json", "http2"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
toml = "1.1.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
walkdir = "2.5.0"
quick-xml = { version = "0.41.0", features = ["serialize"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
pep440_rs = "0.7.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[workspace.metadata.dist]
dist = true
ci = "github"
installers = ["shell", "homebrew", "msi"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
pre-release-commit-message = "release: {{version}}"
tag-message = "{{version}}"
