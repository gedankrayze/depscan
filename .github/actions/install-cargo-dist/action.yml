name: Install verified cargo-dist
description: Install cargo-dist 0.32.0 after verifying its reviewed SHA-256 checksum

runs:
  using: composite
  steps:
    - name: Install cargo-dist on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install-cargo-dist.sh"
    - name: Install cargo-dist on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: '& "$env:GITHUB_ACTION_PATH/install-cargo-dist.ps1"'
