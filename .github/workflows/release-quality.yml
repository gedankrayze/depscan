name: Release quality gate

on:
  workflow_call:

permissions:
  "contents": "read"

jobs:
  quality:
    name: stable tests, lint, and packaging
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Verify release workflow pins and permissions
        run: scripts/verify-release-workflow.sh
      - name: Verify composite-action metadata and invocation
        run: bash scripts/verify-github-action.sh
      - name: Verify Rust module boundaries
        run: bash scripts/check-rust-architecture.sh
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Test every target
        run: cargo +1.98.0 test --workspace --all-targets --locked
      - name: Lint every target
        run: cargo +1.98.0 clippy --all-targets -- -D warnings
      - name: Verify publishable crate archives
        run: cargo +1.98.0 package --workspace --locked
      - name: Build and start the release CLI
        run: |
          cargo +1.98.0 build --release --locked -p depscan-cli
          target/release/depscan --help >/dev/null
