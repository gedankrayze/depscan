name: Live provider smoke

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-provider-smoke:
    name: OSV and registry APIs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
      - name: Run the opt-in live ecosystem matrix
        env:
          DEPSCAN_RUN_LIVE: "1"
        run: >-
          cargo test --locked -p depscan-cli --test e2e_matrix
          live_provider_matrix_for_every_ecosystem -- --exact --ignored --nocapture
