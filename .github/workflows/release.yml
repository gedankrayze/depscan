#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "read"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# This task runs when a pushed tag looks version-like. Before any artifact or
# publishing job, local hardening accepts only vMAJOR.MINOR.PATCH with an
# optional SemVer prerelease suffix; package-qualified and arbitrary prefix tags
# are deliberately rejected.
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
    paths:
      - '.github/actions/install-cargo-dist/**'
      - '.github/release-assets.txt'
      - '.github/workflows/release-acceptance.yml'
      - '.github/workflows/release-quality.yml'
      - '.github/workflows/release.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'action.yml'
      - 'crates/*/Cargo.toml'
      - 'rust-toolchain.toml'
      - 'scripts/github-action/**'
      - 'scripts/verify-github-action.sh'
      - 'scripts/verify-release-assets.sh'
      - 'scripts/verify-release-workflow.sh'
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      publishing: ${{ !github.event.pull_request }}
      release-commit: ${{ steps.release-boundary.outputs.commit }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        uses: ./.github/actions/install-cargo-dist
      - name: Validate the release tag
        if: ${{ !github.event.pull_request }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be an exact semantic version such as v1.1.0" >&2
            exit 1
          fi
      - id: release-boundary
        name: Require the release tag to belong to protected main
        if: ${{ !github.event.pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          event_commit=$(git rev-parse "$GITHUB_SHA^{commit}")
          main_commit=$(git rev-parse refs/remotes/origin/main)
          if [[ "$release_commit" != "$event_commit" ]]; then
            echo "release tag and tag-push event resolve to different commits" >&2
            exit 1
          fi
          if [[ "$release_commit" != "$main_commit" ]]; then
            echo "release tag commit must equal the current protected main tip" >&2
            exit 1
          fi
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"
      # sure would be cool if github gave us proper conditionals...
      # so here's a doubly-nested ternary-via-truthiness to try to provide the best possible
      # functionality based on whether this is a pull_request, and whether it's from a fork.
      # (PRs run on the *source* but secrets are usually on the *target* -- that's *good*
      # but also really annoying to build CI around when it needs secrets to work right.)
      - id: plan
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            dist host --steps=create "--tag=$RELEASE_TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  custom-release-quality:
    uses: ./.github/workflows/release-quality.yml

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
      - custom-release-quality
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      DIST_TARGETS: ${{ join(matrix.targets, ',') }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        uses: ./.github/actions/install-cargo-dist
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install Linux musl dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build artifacts
        shell: bash
        run: |
          # Actually do builds and make zips and whatnot
          tag_args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            tag_args+=("--tag=$RELEASE_TAG")
          fi
          dist build "${tag_args[@]}" --print=linkage --output-format=json \
            --artifacts=local "--target=$DIST_TARGETS" > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        uses: ./.github/actions/install-cargo-dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          tag_args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            tag_args+=("--tag=$RELEASE_TAG")
          fi
          dist build "${tag_args[@]}" --output-format=json --artifacts=global > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - custom-release-quality
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.custom-release-quality.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    permissions:
      "attestations": "write"
      "contents": "write"
      "id-token": "write"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        uses: ./.github/actions/install-cargo-dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host "--tag=$RELEASE_TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Validate release asset inventory
        shell: bash
        run: |
          set -euo pipefail
          plan_manifest=artifacts/plan-dist-manifest.json
          if [[ ! -f "$plan_manifest" ]]; then
            echo "release plan manifest is missing from the downloaded build artifacts" >&2
            exit 1
          fi

          expected_assets="$RUNNER_TEMP/expected-release-assets.txt"
          planned_assets="$RUNNER_TEMP/planned-release-assets.txt"
          LC_ALL=C sort -u .github/release-assets.txt > "$expected_assets"
          if ! cmp -s .github/release-assets.txt "$expected_assets" \
            || [[ $(wc -l < "$expected_assets") -ne 16 ]]; then
            echo "checked-in release asset contract must contain 16 sorted unique filenames" >&2
            cat "$expected_assets" >&2
            exit 1
          fi
          jq -r '.releases[] | select(.display == true) | .artifacts[]' "$plan_manifest" \
            | LC_ALL=C sort -u > "$planned_assets"
          if ! diff -u "$expected_assets" "$planned_assets"; then
            echo "cargo-dist plan differs from the checked-in release asset contract" >&2
            exit 1
          fi

          # This project publishes only the 16 deliverables enumerated by the reviewed plan.
          # Phase manifests remain workflow evidence; the host phase uses the plain spelling.
          rm -f artifacts/*-dist-manifest.json artifacts/dist-manifest.json
          scripts/verify-release-assets.sh artifacts .github/release-assets.txt
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            artifacts/*
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ needs.plan.outputs.release-commit }}"
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # Write and read notes from a file to avoid quoting breaking things
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"

          verify_remote_tag() {
            remote_commit=$(
              git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }'
            )
            if [[ -z "$remote_commit" ]]; then
              remote_commit=$(
                git ls-remote origin "refs/tags/$RELEASE_TAG" | awk 'NR == 1 { print $1 }'
              )
            fi
            if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
              echo "remote release tag no longer resolves to the attested commit" >&2
              exit 1
            fi
          }

          release_args=(--draft --verify-tag --target "$RELEASE_COMMIT" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt")
          if [[ -n "$PRERELEASE_FLAG" ]]; then
            release_args+=("$PRERELEASE_FLAG")
          fi
          verify_remote_tag
          gh release create "$RELEASE_TAG" "${release_args[@]}" artifacts/*
          verify_remote_tag
          gh release edit "$RELEASE_TAG" --draft=false

  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: recursive
