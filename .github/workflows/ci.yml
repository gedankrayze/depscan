name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: rustfmt, clippy
      - name: Verify Rust module boundaries
        if: runner.os == 'Linux'
        run: bash scripts/check-rust-architecture.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build CLI
        run: cargo build --release --locked -p depscan-cli
      - name: Verify Windows action runner ignores a workspace executable decoy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "depscan-action-decoy-cache"
          $offline = Join-Path $cache "offline"
          New-Item -ItemType Directory -Path $offline -Force | Out-Null
          Set-Content `
            -LiteralPath (Join-Path $cache ".depscan-cache.json") `
            -Value '{"schema_version":1,"owner":"depscan"}' `
            -Encoding utf8

          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archivePath = Join-Path $offline "crates_io.zip"
          $archive = [System.IO.Compression.ZipFile]::Open(
            $archivePath,
            [System.IO.Compression.ZipArchiveMode]::Create
          )
          $archive.Dispose()
          $stamp = (Get-Date).ToUniversalTime().ToString(
            "yyyy-MM-ddTHH:mm:ssZ",
            [Globalization.CultureInfo]::InvariantCulture
          )
          Set-Content `
            -LiteralPath (Join-Path $offline "crates_io.synced-at") `
            -Value $stamp `
            -Encoding utf8

          $trustedBinaryPath = Join-Path $env:GITHUB_WORKSPACE "target/release/depscan.exe"
          $trustedBinary = (Resolve-Path -LiteralPath $trustedBinaryPath).Path
          $fixturePath = Join-Path $env:GITHUB_WORKSPACE "fixtures/e2e/cargo"
          $scanPath = (Resolve-Path -LiteralPath $fixturePath).Path
          $report = Join-Path $env:RUNNER_TEMP "depscan-action-decoy-summary.txt"
          $decoy = Join-Path $env:GITHUB_WORKSPACE "depscan.exe"
          if (Test-Path -LiteralPath $decoy) {
            throw "Workspace decoy path already exists: $decoy"
          }

          $env:DEPSCAN_CACHE_DIR = $cache
          $env:DEPSCAN_ACTION_BINARY = ""
          $env:DEPSCAN_ACTION_INSTALLED_BINARY = $trustedBinary
          $env:DEPSCAN_ACTION_PATH_INPUT = $scanPath
          $env:DEPSCAN_ACTION_ECOSYSTEM = "cargo"
          $env:DEPSCAN_ACTION_FORMAT = "summary"
          $env:DEPSCAN_ACTION_OUTPUT = $report
          $env:DEPSCAN_ACTION_FAIL_ON = "never"
          $env:DEPSCAN_ACTION_FAIL_ON_OUTDATED = "never"
          $env:DEPSCAN_ACTION_OFFLINE = "true"
          $env:DEPSCAN_ACTION_NO_CACHE = "false"
          $env:DEPSCAN_ACTION_NO_DEV = "false"
          $env:DEPSCAN_ACTION_DIRECT_ONLY = "false"
          $env:DEPSCAN_ACTION_INCLUDE_WITHDRAWN = "false"

          Set-Content -LiteralPath $decoy -Value "this file must never execute" -Encoding utf8
          try {
            node "$env:GITHUB_WORKSPACE/scripts/github-action/run-depscan.mjs"
            $runnerExit = $LASTEXITCODE
          }
          finally {
            Remove-Item -LiteralPath $decoy -Force -ErrorAction SilentlyContinue
          }
          if ($runnerExit -ne 0) {
            throw "Action runner exited $runnerExit instead of using the exact trusted binary"
          }
          if ((Get-Content -LiteralPath $report -Raw) -notmatch '^depscan: [0-9]+ packages') {
            throw "Action runner did not create the expected report"
          }
      - name: Verify composite-action metadata and invocation
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/verify-github-action.sh
      - name: Prepare the local composite-action smoke
        if: runner.os == 'Linux'
        shell: bash
        env:
          ACTION_CACHE: ${{ runner.temp }}/depscan-action-cache
        run: |
          python3 - "$ACTION_CACHE" <<'PY'
          import datetime
          import json
          import pathlib
          import sys
          import zipfile

          root = pathlib.Path(sys.argv[1])
          (root / "offline").mkdir(parents=True)
          (root / ".depscan-cache.json").write_text(
              json.dumps({"schema_version": 1, "owner": "depscan"}) + "\n",
              encoding="utf-8",
          )
          with zipfile.ZipFile(
              root / "offline" / "crates_io.zip",
              "w",
              compression=zipfile.ZIP_DEFLATED,
          ):
              pass
          stamp = (
              datetime.datetime.now(datetime.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          (root / "offline" / "crates_io.synced-at").write_text(
              stamp + "\n",
              encoding="utf-8",
          )
          PY
          echo "DEPSCAN_CACHE_DIR=$ACTION_CACHE" >> "$GITHUB_ENV"
      - name: Run the checked-in composite action
        if: runner.os == 'Linux'
        uses: ./
        with:
          binary: target/release/depscan
          path: fixtures/e2e/cargo
          format: summary
          output: ${{ runner.temp }}/depscan-action-summary.txt
          fail-on: never
          fail-on-outdated: never
          offline: "true"
      - name: Verify the composite-action report
        if: runner.os == 'Linux'
        shell: bash
        run: |
          grep -Eq '^depscan: [0-9]+ packages' "${{ runner.temp }}/depscan-action-summary.txt"
      - name: Dogfood an offline workspace self-scan
        run: cargo test --locked -p depscan-cli --test e2e_matrix offline_workspace_self_scan -- --exact --nocapture

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - name: Check MSRV compatibility
        run: cargo check --workspace --all-targets --locked
      - name: Test on MSRV
        run: cargo test --workspace --all-targets --locked
