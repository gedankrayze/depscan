name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked
      - name: Build CLI
        run: cargo build --release --locked -p depscan-cli
      - name: Dogfood an offline workspace self-scan
        run: cargo test --locked -p depscan-cli --test e2e_matrix offline_workspace_self_scan -- --exact --nocapture

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Check MSRV compatibility
        run: cargo check --workspace --all-targets --locked
      - name: Test on MSRV
        run: cargo test --workspace --all-targets --locked
